name: Remaining browser acceptance

on:
  push:
    branches: [codex/lead-intelligence-design-v1]
    paths:
      - '.github/workflows/browser-acceptance.yml'
      - 'analytics/tests/browser/**'
  workflow_dispatch:
    inputs:
      case_names:
        description: 'Comma-separated cases, or * for all; default runs the remaining lifecycle cases.'
        required: false
        default: 'persistent-offline-close-reopen,native-window-background'

permissions:
  contents: read

jobs:
  acceptance:
    name: Remaining browser gates (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    env:
      FARPOINT_ACCEPTANCE_ENGINES: ${{ matrix.engine }}
      FARPOINT_ACCEPTANCE_HEADED: '1'
      FARPOINT_ACCEPTANCE_CASES: ${{ inputs.case_names || 'persistent-offline-close-reopen,native-window-background' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Record controlled test scope
        run: |
          export FARPOINT_ACCEPTANCE_EVIDENCE="$RUNNER_TEMP/farpoint-acceptance-evidence"
          printf 'FARPOINT_ACCEPTANCE_EVIDENCE=%s\n' "$FARPOINT_ACCEPTANCE_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$FARPOINT_ACCEPTANCE_EVIDENCE"
          node -e 'require("fs").writeFileSync(process.env.FARPOINT_ACCEPTANCE_EVIDENCE+"/run.json",JSON.stringify({commit:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,engine:process.env.FARPOINT_ACCEPTANCE_ENGINES,scope:"Isolated synthetic browser profiles under Xvfb; all RFQs mocked; no customer data or provider writes",canonical_archive_required:true},null,2))'
      - name: Install pinned engine and browser dependencies
        run: |
          set -o pipefail
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1 2>&1 | tee "$FARPOINT_ACCEPTANCE_EVIDENCE/npm-install.log"
          npx --no-install playwright install --with-deps "$FARPOINT_ACCEPTANCE_ENGINES" 2>&1 | tee "$FARPOINT_ACCEPTANCE_EVIDENCE/browser-install.log"
          sudo apt-get install --no-install-recommends --yes openbox xdotool x11-utils 2>&1 | tee "$FARPOINT_ACCEPTANCE_EVIDENCE/window-tools-install.log"
          command -v xvfb-run
      - name: Check evidence fixture and trace parser
        if: matrix.engine == 'chromium'
        run: |
          set -o pipefail
          node --test analytics/tests/browser/*.test.mjs 2>&1 | tee "$FARPOINT_ACCEPTANCE_EVIDENCE/unit.log"
      - name: Run remaining browser gates
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash -c '
            openbox > "$FARPOINT_ACCEPTANCE_EVIDENCE/window-manager.log" 2>&1 &
            manager_pid=$!
            trap "kill $manager_pid 2>/dev/null || true" EXIT
            node analytics/tests/browser/check-acceptance.mjs "$FARPOINT_ACCEPTANCE_EVIDENCE"
          ' 2>&1 | tee "$FARPOINT_ACCEPTANCE_EVIDENCE/browser.log"
      - name: Preserve transfer artifact for permanent archive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.engine }}
          path: ${{ runner.temp }}/farpoint-acceptance-evidence/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      # This is a transfer buffer. Preserve every attempt, including failures,
      # in the private permanent archive and verify downloaded hashes.
