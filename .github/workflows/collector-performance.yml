name: Bounded candidate performance acceptance

on:
  push:
    branches: [codex/lead-intelligence-design-v1]
    paths:
      - '.github/workflows/collector-performance.yml'
      - 'analytics/deploy/cloudflare/test/collector-performance.py'
      - 'analytics/deploy/cloudflare/test/collector-performance.test.py'
      - 'analytics/deploy/cloudflare/test/performance-recipient-public.pem'
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run reviewed 1108 candidate POST attempts only after archive/key prerequisites and explicit GO'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python3 -W error analytics/deploy/cloudflare/test/collector-performance.test.py
      - run: node --test analytics/deploy/cloudflare/test/performance-r2-check.test.mjs
  candidate:
    needs: unit
    if: github.repository == 'FarpointEnergy/farpointenergy.com' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[farpoint-perf-go]')) || (github.event_name == 'workflow_dispatch' && inputs.run_live))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run bounded candidate tests and seal raw evidence
        env:
          FARPOINT_PERF_GO: reviewed-1108-candidate-posts
        run: python3 analytics/deploy/cloudflare/test/collector-performance.py
      - name: Transfer encrypted evidence and safe summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/farpoint-performance-transfer/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      # No secret reaches CI. The private decryption key is owner-private and
      # must be archived before GO. Artifact expiry is not durable retention:
      # verify, decrypt and preserve every attempt in the private project archive.
